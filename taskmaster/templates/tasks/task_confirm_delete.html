{% extends 'base.html' %}
{% block title %}Удалить задачу — TaskMaster{% endblock %}

{% block content %}
<div class="container py-2" style="max-width: 480px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
        <div class="mb-3">
            <i class="bi bi-trash3 text-danger" style="font-size: 3rem;"></i>
        </div>
        <h4 class="fw-bold">Удалить задачу?</h4>
        <p class="text-muted">Задача <strong>«{{ task.title }}»</strong> будет удалена безвозвратно.</p>
        <div class="d-flex gap-2 justify-content-center mt-3">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger rounded-3 px-4">
                    <i class="bi bi-trash me-2"></i>Удалить
                </button>
            </form>
            <a href="{% url 'task_list' %}" class="btn btn-light rounded-3 px-4">Отмена</a>
        </div>
    </div>
</div>
{% endblock %}
